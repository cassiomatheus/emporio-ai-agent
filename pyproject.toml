[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-ai-agent"
version = "0.1.0"
description = "Fundação do agente de atendimento do Empório da Música"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.10,<3",
    "PyMuPDF>=1.26,<2",
    "openai>=3.42,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
app = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = ["local_data: verifica o snapshot original quando disponível em data/raw"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
